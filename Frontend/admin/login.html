<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - W.K.F Management System</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />

    <style>
      body {
        background: linear-gradient(
          135deg,
          var(--primary-blue),
          var(--primary-green)
        );
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-container {
        width: 100%;
        max-width: 400px;
        padding: var(--spacing-md);
      }

      .login-card {
        background: var(--white);
        border-radius: var(--border-radius-lg);
        padding: var(--spacing-lg);
        box-shadow: var(--shadow-lg);
      }

      .login-header {
        text-align: center;
        margin-bottom: var(--spacing-lg);
      }

      .login-header .logo {
        justify-content: center;
        margin-bottom: var(--spacing-sm);
      }

      .login-header h2 {
        color: var(--primary-blue);
        margin-bottom: var(--spacing-xs);
      }

      .login-header p {
        color: var(--dark-gray);
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="logo">
            <img
              src="../assets/images/logo.png"
              alt="WKF Logo"
              style="height: 60px"
            />
            <h1 style="font-size: 1.75rem">W.K.F</h1>
          </div>
          <h2>Admin Login</h2>
          <p>Enter your credentials to access the dashboard</p>
        </div>

        <form id="adminLoginForm">
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="admin@wkf.org"
              required
              autofocus
            />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="••••••••"
              required
            />
          </div>

          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: var(--spacing-md);
            "
          >
            <label style="display: flex; align-items: center; gap: 5px">
              <input type="checkbox" name="remember" />
              <span style="font-size: 0.875rem">Remember me</span>
            </label>
            <a href="#" style="font-size: 0.875rem">Forgot password?</a>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-lg"
            style="width: 100%"
          >
            <i class="fas fa-sign-in-alt" style="margin-right: 8px"></i>
            Login to Dashboard
          </button>

          <div style="margin-top: var(--spacing-md); text-align: center">
            <p style="font-size: 0.875rem; color: var(--dark-gray)">
              <i class="fas fa-shield-alt"></i> Secure, encrypted authentication
            </p>
          </div>
        </form>

        <!-- Demo credentials for testing -->
        <div
          style="
            margin-top: var(--spacing-lg);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--light-gray);
            text-align: center;
          "
        >
          <p
            style="
              font-size: 0.875rem;
              color: var(--dark-gray);
              margin-bottom: 5px;
            "
          >
            Demo Credentials:
          </p>
          <p style="font-size: 0.875rem; margin-bottom: 0">
            <strong>Email:</strong> admin@wkf.org
          </p>
          <p style="font-size: 0.875rem"><strong>Password:</strong> admin123</p>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("adminLoginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          // Simple demo authentication (replace with Firebase Auth)
          if (email === "admin@wkf.org" && password === "admin123") {
            // Show success message
            const btn = this.querySelector('button[type="submit"]');
            btn.innerHTML =
              '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            btn.disabled = true;

            setTimeout(() => {
              window.location.href = "dashboard.html";
            }, 1500);
          } else {
            alert("Invalid email or password. Try admin@wkf.org / admin123");
          }
        });
    </script>
  </body>
</html>
